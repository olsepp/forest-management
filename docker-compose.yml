services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ghcr.io/${GITHUB_USER}/forest-management-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      JWT__Key: ${JWT_SECRET}
      JWT__Issuer: ForestManagement
      JWT__Audience: ForestManagementUsers
      JWT__ExpiresInMinutes: "60"
      JWT__RefreshTokenExpiresInDays: "7"
      FrontendUrl: ${FRONTEND_URL}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      SeedAdmin__Username: ${SEED_ADMIN_USERNAME:-admin}
    networks:
      - app-network

  frontend:
    image: ghcr.io/${GITHUB_USER}/forest-management-frontend:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup backend frontend nginx
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
