                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock
                command: --interval 300 --cleanup backend frontend nginx
                networks:
                  - app-network

            volumes:
              pgdata:

            networks:
              app-network:
                driver: bridge
            COMPOSEFILE

            cat > /opt/forest-management/nginx.conf << 'NGINXFILE'
            resolver 127.0.0.11 valid=10s;

            server {
