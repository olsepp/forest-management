name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/forest-management-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/forest-management-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-staging:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Write docker-compose.yml
            cat > /opt/forest-management/docker-compose.yml << 'COMPOSEFILE'
            services:
              postgres:
                image: postgres:17-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_USER: ${DB_USER}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                  POSTGRES_DB: ${DB_NAME}
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                networks:
                  - app-network

              backend:
                image: ghcr.io/${GITHUB_USER}/forest-management-backend:latest
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                environment:
                  ASPNETCORE_ENVIRONMENT: Production
                  ConnectionStrings__DefaultConnection: Host=postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
                  JWT__Key: ${JWT_SECRET}
                  JWT__Issuer: ForestManagement
                  JWT__Audience: ForestManagementUsers
                  JWT__ExpiresInMinutes: "60"
                  JWT__RefreshTokenExpiresInDays: "7"
                  FrontendUrl: ${FRONTEND_URL}
                  SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
                  SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
                  SeedAdmin__Username: ${SEED_ADMIN_USERNAME:-admin}
                networks:
                  - app-network

              frontend:
                image: ghcr.io/${GITHUB_USER}/forest-management-frontend:latest
                restart: unless-stopped
                environment:
                  PORT: "3000"
                networks:
                  - app-network

              nginx:
                image: nginx:alpine
                restart: unless-stopped
                ports:
                  - "80:80"
                volumes:
                  - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - frontend
                  - backend
                networks:
                  - app-network

              watchtower:
                image: containrrr/watchtower
                restart: unless-stopped
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock
                command: --interval 300 --cleanup backend frontend nginx
                networks:
                  - app-network

            volumes:
              pgdata:

            networks:
              app-network:
                driver: bridge
            COMPOSEFILE

            # Write nginx.conf
            cat > /opt/forest-management/nginx.conf << 'NGINXFILE'
            resolver 127.0.0.11 valid=10s;

            server {
                listen 80;

                gzip on;
                gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

                location /api/map-tiles {
                    set $frontend_upstream http://frontend:3000;
                    proxy_pass $frontend_upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /api/forest-stands {
                    set $frontend_upstream http://frontend:3000;
                    proxy_pass $frontend_upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /api/cadastral-unit {
                    set $frontend_upstream http://frontend:3000;
                    proxy_pass $frontend_upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /api/ {
                    set $backend_upstream http://backend:5255;
                    proxy_pass $backend_upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    set $frontend_upstream http://frontend:3000;
                    proxy_pass $frontend_upstream;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINXFILE

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/forest-management
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  deploy-production:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USER }}
          key: ${{ secrets.PROD_VPS_SSH_KEY }}
          script: |
            cat > /opt/forest-management/docker-compose.yml << 'COMPOSEFILE'
            services:
              postgres:
                image: postgres:17-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_USER: ${DB_USER}
                  POSTGRES_PASSWORD: ${DB_PASSWORD}
                  POSTGRES_DB: ${DB_NAME}
                volumes:
                  - pgdata:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5
                networks:
                  - app-network

              backend:
                image: ghcr.io/${GITHUB_USER}/forest-management-backend:latest
                restart: unless-stopped
                depends_on:
                  postgres:
                    condition: service_healthy
                environment:
                  ASPNETCORE_ENVIRONMENT: Production
                  ConnectionStrings__DefaultConnection: Host=postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
                  JWT__Key: ${JWT_SECRET}
                  JWT__Issuer: ForestManagement
                  JWT__Audience: ForestManagementUsers
                  JWT__ExpiresInMinutes: "60"
                  JWT__RefreshTokenExpiresInDays: "7"
                  FrontendUrl: ${FRONTEND_URL}
                  SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
                  SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
                  SeedAdmin__Username: ${SEED_ADMIN_USERNAME:-admin}
                networks:
                  - app-network

              frontend:
                image: ghcr.io/${GITHUB_USER}/forest-management-frontend:latest
                restart: unless-stopped
                environment:
                  PORT: "3000"
                networks:
                  - app-network

              nginx:
                image: nginx:alpine
                restart: unless-stopped
                ports:
